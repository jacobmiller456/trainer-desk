name: Daily card price snapshot

# Daily (in up to three runs): save TCGplayer market prices from TCGdex into prices/<month>/<set>.json (recent sets daily,
# older sets weekly; see scripts/snapshot-prices.mjs) for the price charts, price movers and the set pages' most valuable
# cards, rebuild the set pages, then commit (the push to main redeploys the site). Can also be run by hand.
on:
  schedule:
    - cron: '41 7 * * *'   # three runs each morning (UTC); each skips sets that are already up to date, so a slow or
    - cron: '41 8 * * *'   # interrupted run is finished by the next one
    - cron: '41 9 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: push-to-main-data
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/snapshot-prices.mjs
      - run: node scripts/price-movers.mjs   # weekly risers/fallers for the TCG tab (prices/movers.json)
      - run: node scripts/build-pages.mjs    # set pages show each set's most valuable cards from these prices
      - name: Commit changes
        run: |
          git add -A prices tcg tcgdata sitemap.xml assets/tcg-new-sets.json
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git config user.name "trainer-desk-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Daily price snapshot"
          for i in 1 2 3; do git pull --rebase && git push && exit 0; sleep 10; done; exit 1
