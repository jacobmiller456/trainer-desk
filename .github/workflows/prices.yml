name: Daily card price snapshot

# Daily (in up to three runs): save every card's TCGplayer market price (from pokemontcg.io) into prices/<month>/<set>.json for the
# price-history sparklines on card backs, then commit (the push to main redeploys the site). Can also be run by hand.
# Optional repo secret POKEMONTCG_API_KEY raises the API's rate limit; without it the job just runs slower.
on:
  schedule:
    - cron: '41 7 * * *'   # three runs each morning (UTC): without an API key one run covers ~95 sets in its 40 minutes;
    - cron: '41 8 * * *'   # each run skips sets already saved today, so together they cover every set
    - cron: '41 9 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: push-to-main-data
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/snapshot-prices.mjs
        env:
          POKEMONTCG_API_KEY: ${{ secrets.POKEMONTCG_API_KEY }}
      - run: node scripts/price-movers.mjs   # weekly risers/fallers for the TCG tab (prices/movers.json)
      - name: Commit changes
        run: |
          git add -A prices
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git config user.name "trainer-desk-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Daily price snapshot"
          for i in 1 2 3; do git pull --rebase && git push && exit 0; sleep 10; done; exit 1
